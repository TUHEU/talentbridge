# .github/workflows/flutter_ci.yml
# ============================================================
# Talent Bridge Frontend — CI Pipeline
# Repo: talent_bridge_frontend
# ============================================================
name: Flutter CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION:    '17'

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 — Code quality (format + analyze)
  # ──────────────────────────────────────────────────────────
  quality:
    name: 🔍 Format & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Static analysis
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-report
          path: analyze.txt
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # JOB 2 — Tests with coverage
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit/ --reporter=github

      - name: Run widget tests
        run: flutter test test/widget/ --reporter=github

      - name: Run integration tests
        run: flutter test test/integration/ --reporter=github

      - name: Generate coverage
        run: flutter test --coverage --reporter=compact

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/lcov.info
          flags: flutter
          name: talent-bridge-flutter
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # JOB 3A — Build Android Debug APK (PRs & branches)
  # ──────────────────────────────────────────────────────────
  build_android_debug:
    name: 🤖 Android Debug APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:5003/api' }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talent-bridge-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # JOB 3B — Build Android Release APK (main branch only)
  # ──────────────────────────────────────────────────────────
  build_android_release:
    name: 🚀 Android Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode Android keystore
        if: secrets.KEYSTORE_BASE64 != ''
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
        continue-on-error: true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL }} \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: talent-bridge-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────
  # JOB 4 — Build Flutter Web
  # ──────────────────────────────────────────────────────────
  build_web:
    name: 🌐 Web Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:5003/api' }} \
            --web-renderer canvaskit

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: talent-bridge-web-${{ github.sha }}
          path: build/web/
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # JOB 5 — Deploy web to GitHub Pages (main only)
  # ──────────────────────────────────────────────────────────
  deploy_web:
    name: 📦 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build_web, build_android_release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build for GitHub Pages
        run: |
          flutter build web --release \
            --base-href "/talent-bridge/" \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ──────────────────────────────────────────────────────────
  # JOB 6 — PR size & quality checks
  # ──────────────────────────────────────────────────────────
  pr_checks:
    name: 📋 PR Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Check PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false
        continue-on-error: true
