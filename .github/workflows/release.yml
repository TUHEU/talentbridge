# .github/workflows/release.yml
# ============================================================
# Talent Bridge Frontend — Automated Release Pipeline
# Triggered by pushing a version tag: git tag v1.0.0 && git push --tags
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION:    '17'

jobs:
  release:
    name: 🎉 Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # ── Android release APK ──────────────────────────────
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL }} \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      # ── App Bundle (for Play Store) ──────────────────────
      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL }} \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      # ── Flutter Web ──────────────────────────────────────
      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Zip web build
        run: |
          cd build/web && zip -r ../../talent-bridge-web-${{ github.ref_name }}.zip .

      # ── Create GitHub Release ────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Talent Bridge ${{ github.ref_name }}"
          body: |
            ## What's New in ${{ github.ref_name }}

            ### Downloads
            - **Android APK** — Install directly on your Android device
            - **Android Bundle** — Upload to Google Play Store
            - **Web Build** — Deploy to any static hosting

            ### Changelog
            See [CHANGELOG.md](CHANGELOG.md) for full details.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            talent-bridge-web-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
